[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autosymph"
version = "0.1.0"
description = "Agent orchestrator — polls Linear, spawns AI coding agents, manages implement → verify → review → merge lifecycle"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Implicit Labs", email = "autosymph@implicitlabs.ai" }]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Optional BYOK tracing/eval-loop integration. Users provide their own
# BRAINTRUST_API_KEY; autosymph never ships or brokers Braintrust credentials.
tracing = [
    "braintrust",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "mypy>=1.10",
    "ruff>=0.4",
    "types-pyyaml>=6.0",
]

[project.scripts]
autosymph = "autosymph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autosymph"]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Keep the repository's historical lint contract explicit so Ruff upgrades do
# not silently opt the whole codebase into newly added rule families.
select = ["E4", "E7", "E9", "F"]
